name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official development toolchain
        env:
          MOONBIT_INSTALL_DEV: '1'
        run: |
          curl --fail --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          moon version --all
          node --version
          gcc --version | head -1
      - name: Check formatting and public interfaces
        run: |
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Strict check, test, build
        run: |
          moon check --target ${{ matrix.target }} --deny-warn
          moon test --target ${{ matrix.target }} --deny-warn
          moon build --target ${{ matrix.target }} --release --deny-warn
          moon run examples --target ${{ matrix.target }} --deny-warn
      - name: Real CLI acceptance
        if: matrix.target == 'js'
        run: node tools/test-cli.mjs
      - name: Core LOC audit
        run: python3 tools/audit.py --minimum-lines 1500 --minimum-commits 20
